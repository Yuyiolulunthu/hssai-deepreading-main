# ============================================================
# 讀伴 ・ hssai-deepreading.phys.nthu.edu.tw
# 置於 nginx-node:/etc/nginx/sites-available/hssai-deepreading.phys.nthu.edu.tw
# 再 ln -s 到 sites-enabled/,nginx -t 後 reload。
# SSL 由 certbot --nginx 產生(執行 certbot 前先放好本檔的 HTTP 版本)。
# ------------------------------------------------------------
# 注意:upstream 一律寫 IP,不寫主機名——nginx 只在啟動時解析非變數 upstream。
# ============================================================

server {
    listen 80;
    server_name hssai-deepreading.phys.nthu.edu.tw;

    access_log /var/log/nginx/hssai-deepreading.access.log;
    error_log  /var/log/nginx/hssai-deepreading.error.log;

    client_max_body_size 32M;

    # ---- 安全:封鎖執行期資料目錄 ----
    # data/ 內含 stats.json、school.json(學生名單)、prompts.json、analysis.json。
    # 容器內的 Apache 有 .htaccess 保護,此處為第二道防線(縱深防禦)。
    location ^~ /data/ {
        deny all;
        return 404;
    }

    # ---- 安全:阻擋版控與設定檔外流 ----
    location ~ /\.(git|env|htaccess|htpasswd) {
        deny all;
        return 404;
    }
    location ~ ^/(config\.php|config\.sample\.php)$ {
        # config.php 本身會被 PHP 解譯不會外洩,但明確擋掉更保險
        deny all;
        return 404;
    }
    location ^~ /deploy/ {
        deny all;
        return 404;
    }

    # ---- 應用主體 ----
    location / {
        proxy_pass http://10.0.0.101:3060;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # LLM 回應可能較久(解析階段一約 30–60 秒)
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ---- 靜態資源快取 ----
    location ~* ^/assets/.*\.(css|js|png|jpg|jpeg|svg|webp|woff2?)$ {
        proxy_pass http://10.0.0.101:3060;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
